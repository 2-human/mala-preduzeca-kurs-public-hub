<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Georgia,'Times New Roman',serif">
  <rect width="1080" height="1080" fill="#f6f8f7"/>
  <rect width="1080" height="360" fill="#0b2b27"/>
  <!-- brand row -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="90" y="80" width="46" height="46" rx="11" fill="#0f766e"/>
    <text x="113" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#eafaf6">SB</text>
    <text x="152" y="110" font-size="21" letter-spacing="2.5" fill="#9fded2">VAŠ INSTRUKTOR</text>
  </g>
  <!-- avatar -->
  <g transform="translate(150,250)">
    <circle cx="120" cy="120" r="128" fill="#f6f8f7" stroke="#0f766e" stroke-width="6"/>
    <clipPath id="clip"><circle cx="120" cy="120" r="122"/></clipPath>
    <g clip-path="url(#clip)" fill="#0f766e">
      <circle cx="120" cy="96" r="52"/>
      <path d="M28 250 C28 176 78 150 120 150 C162 150 212 176 212 250 Z"/>
    </g>
  </g>
  <!-- headline -->
  <text x="440" y="230" font-size="62" font-weight="700" fill="#f2f7f5">
    <tspan x="440">Upoznajte</tspan>
    <tspan x="440" dy="72">vašeg mentora</tspan>
  </text>
  <!-- name + role -->
  <text x="90" y="620" font-size="70" font-weight="700" fill="#17211f">Ime Prezime</text>
  <text x="90" y="676" font-family="system-ui,sans-serif" font-size="34" fill="#0f766e">mentor · praktičar u malom biznisu</text>
  <!-- quote -->
  <g>
    <text x="90" y="800" font-size="110" fill="#d6efe9">„</text>
    <text x="150" y="800" font-size="46" fill="#334744">
      <tspan x="150">Ne predajem teoriju.</tspan>
      <tspan x="150" dy="64">Pokazujem šta zaista radi</tspan>
      <tspan x="150" dy="64">u malom biznisu.</tspan>
    </text>
  </g>
  <!-- footer -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="90" y="1012" font-size="26" fill="#8a9a96">* ime i biografija su placeholder</text>
    <text x="990" y="1012" text-anchor="end" font-size="30" font-weight="600" fill="#0f766e">Reel ▸</text>
  </g>
</svg>
