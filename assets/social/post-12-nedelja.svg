      <circle cx="110" cy="200" r="11"/><circle cx="210" cy="240" r="14"/><circle cx="60" cy="260" r="13"/>
      <circle cx="175" cy="185" r="10"/><circle cx="250" cy="90" r="12"/>
    </g>
    <text x="540" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="80" fill="#0f766e">→</text>
    <text x="900" y="0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#5b6b68">sistem</text>
    <g fill="#0f766e">
      <circle cx="800" cy="70" r="14"/><circle cx="870" cy="70" r="14"/><circle cx="940" cy="70" r="14"/><circle cx="1010" cy="70" r="14"/>
      <circle cx="800" cy="140" r="14"/><circle cx="870" cy="140" r="14"/><circle cx="940" cy="140" r="14"/><circle cx="1010" cy="140" r="14"/>
      <circle cx="800" cy="210" r="14"/><circle cx="870" cy="210" r="14"/><circle cx="940" cy="210" r="14"/><circle cx="1010" cy="210" r="14"/>
    </g>
