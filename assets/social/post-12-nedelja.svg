  <!-- carousel dots + cta -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <g transform="translate(90,930)">
      <circle cx="0" cy="0" r="7" fill="#0f766e"/><circle cx="26" cy="0" r="7" fill="#c7d6d2"/>
      <circle cx="52" cy="0" r="7" fill="#c7d6d2"/><circle cx="78" cy="0" r="7" fill="#c7d6d2"/>
      <text x="120" y="8" font-size="28" fill="#5b6b68">prevuci za ceo plan</text>
    </g>
    <text x="990" y="938" text-anchor="end" font-size="30" font-weight="600" fill="#115e59">Karusel ▸</text>
