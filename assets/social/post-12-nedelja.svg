<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Georgia,'Times New Roman',serif">
  <rect width="1080" height="1080" fill="#f6f8f7"/>
  <rect width="1080" height="14" fill="#0f766e"/>
  <!-- brand row -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="90" y="86" width="46" height="46" rx="11" fill="#0f766e"/>
    <text x="113" y="117" text-anchor="middle" font-size="20" font-weight="700" fill="#eafaf6">SB</text>
    <text x="152" y="116" font-size="21" letter-spacing="2.5" fill="#5b6b68">6 NEDELJA · PLAN PROGRAMA</text>
  </g>
  <!-- headline -->
  <text x="90" y="300" font-size="120" font-weight="700" fill="#115e59">6 nedelja</text>
  <text x="90" y="392" font-size="58" fill="#17211f">
    <tspan x="90">od haosa do sistema</tspan>
    <tspan x="90" dy="72">koji radi i bez vas</tspan>
  </text>
  <!-- chaos -> system visual -->
  <g transform="translate(0,560)">
